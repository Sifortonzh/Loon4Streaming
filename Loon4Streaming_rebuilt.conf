[Rule]
# Local rules have the highest priority in Loon. Put only deliberate overrides here.
DOMAIN-SUFFIX,youku.com,YOUKU
DOMAIN-SUFFIX,ykimg.com,YOUKU
DOMAIN-SUFFIX,tudou.com,YOUKU
DOMAIN-SUFFIX,soku.com,YOUKU
DOMAIN-SUFFIX,wetv.vip,WeTV
DOMAIN-SUFFIX,wetvinfo.com,WeTV
DOMAIN-KEYWORD,wetv,WeTV
DOMAIN-SUFFIX,iq.com,iQIYI

# LAN/reserved networks never leave the device through a proxy node.
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

# Domestic fallback and final proxy catch-all.
GEOIP,CN,DIRECT
FINAL,Group

